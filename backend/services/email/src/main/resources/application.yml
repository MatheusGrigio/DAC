server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: email
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:bantads}
    password: ${RABBIT_PASSWORD:change-me}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USER:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mail:
  dev: ${MAIL_DEV:true}
  outbox-dir: ${MAIL_OUTBOX_DIR:/tmp/outbox}
  from: ${MAIL_FROM:${GMAIL_USER:bantads@localhost}}
