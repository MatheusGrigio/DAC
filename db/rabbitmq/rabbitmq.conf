
# Configuração básica do RabbitMQ para ambiente de desenvolvimento.

# Carrega usuários, vhosts, filas e bindings definidos em definitions.json na subida do container.
management.load_definitions = /etc/rabbitmq/definitions.json

# Loga no console (facilita ver logs com `docker compose logs rabbitmq`).
log.console = true
log.console.level = info

# Evita que o RabbitMQ trave por falta de memória em máquinas de desenvolvimento.
vm_memory_high_watermark.relative = 0.6