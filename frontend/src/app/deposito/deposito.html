<section class="container operacao-cliente py-4">
  <h1 class="h3 mb-4">Depósito</h1>

  @if (conta(); as c) {
    <dl class="row mb-4">
      <dt class="col-6">Conta</dt>
      <dd class="col-6 text-end">{{ c.numero }}</dd>

      <dt class="col-6">Saldo atual</dt>
      <dd class="col-6 text-end">{{ c.saldo | moeda }}</dd>
    </dl>
  } @else if (!erro()) {
    <p role="status">Carregando sua conta...</p>
  }

  <form (submit)="enviar($event)" novalidate>
    <label for="valor" class="form-label">Valor do depósito</label>
    <input
      id="valor"
      name="valor"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      class="form-control form-control-lg"
      placeholder="R$ 0,00"
      [value]="valorTexto()"
      (input)="aoDigitar($event)"
      [disabled]="enviando() || atualizandoSaldo() || !conta()"
    />

    @if (erro()) {
      <div class="alert alert-danger mt-3" role="alert">{{ erro() }}</div>
    }
    @if (atualizandoSaldo()) {
      <div class="alert alert-info mt-3" role="status">
        Depósito registrado. Atualizando o saldo...
      </div>
    } @else if (sucesso()) {
      <div class="alert alert-success mt-3" role="status">{{ sucesso() }}</div>
    }

    <div class="d-flex flex-wrap gap-2 mt-4">
      <a routerLink="/cliente/dashboard" class="btn btn-outline-secondary">Voltar</a>
      <button type="submit" class="btn btn-primary" [disabled]="!podeEnviar()">
        @if (enviando()) {
          Depositando...
        } @else {
          Depositar
        }
      </button>
    </div>
  </form>
</section>

<app-confirmacao />
