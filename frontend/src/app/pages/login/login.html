<div class="container-fluid login-page d-flex align-items-center justify-content-center min-vh-100">
	<div class="card shadow-sm p-4 login-card w-100" style="max-width: 420px;">
		<div class="text-center mb-4">
			<h2 class="fw-bold text-primary mb-1">BANTADS</h2>
			<p class="text-secondary small">Internet Banking do TADS</p>
		</div>

		<form (ngSubmit)="fazerLogin()" #loginForm="ngForm" novalidate>
			<div class="mb-3">
				<label for="email" class="form-label fw-semibold">E-mail</label>
				<input
					id="email"
					name="email"
					type="email"
					class="form-control"
					placeholder="exemplo@bantads.com.br"
					[(ngModel)]="credenciais.email"
					#emailField="ngModel"
					required
					email
				/>
				<div *ngIf="emailField.invalid && emailField.touched" class="text-danger small mt-1">
					Informe um e-mail válido.
				</div>
			</div>

			<div class="mb-3">
				<label for="senha" class="form-label fw-semibold">Senha</label>
				<input
					id="senha"
					name="senha"
					type="password"
					class="form-control"
					placeholder="Digite sua senha"
					[(ngModel)]="credenciais.senha"
					#senhaField="ngModel"
					required
				/>
				<div *ngIf="senhaField.invalid && senhaField.touched" class="text-danger small mt-1">
					A senha é obrigatória.
				</div>
			</div>

			<div *ngIf="erroLogin" class="alert alert-danger py-2 small mb-3" role="alert">
				{{ erroLogin }}
			</div>

			<button
				type="submit"
				class="btn btn-primary w-100 py-2 fw-semibold"
				[disabled]="loginForm.invalid || carregando"
			>
				<span *ngIf="carregando" class="spinner-border spinner-border-sm me-1" role="status"></span>
				<span>{{ carregando ? 'Entrando...' : 'Entrar' }}</span>
			</button>
		</form>

		<hr class="my-4" />

		<div class="text-center">
			<p class="small text-muted mb-2">Primeiro acesso ou não é cliente?</p>
			<a routerLink="/autocadastro" class="btn btn-outline-secondary btn-sm w-100">
				Solicitar Autocadastro
			</a>
		</div>
	</div>
</div>
