<section class="container py-4" style="max-width: 640px">
  <h1 class="h3 mb-4">Saque</h1>

  @if (carregando()) {
    <p role="status">Carregando sua conta...</p>
  } @else if (conta(); as c) {
    <dl class="row mb-4">
      <dt class="col-6">Conta</dt>
      <dd class="col-6 text-end">{{ c.numero }}</dd>

      <dt class="col-6">Saldo atual</dt>
      <dd class="col-6 text-end">{{ c.saldo | moeda }}</dd>
    </dl>
  }

  <form (submit)="enviar($event)" novalidate>
    <label for="valorSaque" class="form-label">Valor do saque</label>

    <input
      id="valorSaque"
      name="valorSaque"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      class="form-control form-control-lg"
      placeholder="R$ 0,00"
      [value]="valorTexto()"
      (input)="aoDigitar($event)"
      [disabled]="ocupado() || !conta()"
    />

    @if (erro()) {
      <div class="alert alert-danger mt-3" role="alert">
        {{ erro() }}
      </div>
    }

    @if (atualizandoSaldo()) {
      <div class="alert alert-info mt-3" role="status">
        Saque registrado. Atualizando o saldo...
      </div>
    } @else if (sucesso()) {
      <div class="alert alert-success mt-3" role="status">
        {{ sucesso() }}
      </div>
    }

    <div class="d-flex flex-wrap gap-2 mt-4">
      <a
        routerLink="/cliente/dashboard"
        class="btn btn-outline-secondary"
      >
        Voltar
      </a>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!podeEnviar()"
      >
        @if (enviando()) {
          Sacando...
        } @else {
          Sacar
        }
      </button>
    </div>
  </form>
</section>
