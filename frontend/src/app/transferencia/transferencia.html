<section class="container operacao-cliente py-4">
  <h1 class="h3 mb-4">Transferência</h1>

  <form [formGroup]="transferenciaForm" (ngSubmit)="realizarTransferencia()" novalidate>
    <div class="mb-3">
      <label for="contaDestino" class="form-label">Número da conta de destino</label>
      <input
        id="contaDestino"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="4"
        class="form-control form-control-lg"
        formControlName="contaDestino"
        placeholder="Ex.: 1291"
        [readOnly]="enviando"
        [class.is-invalid]="transferenciaForm.controls.contaDestino.invalid && transferenciaForm.controls.contaDestino.touched"
      />
      <div class="invalid-feedback">Informe um número de conta com 4 dígitos.</div>
    </div>

    <label for="valor" class="form-label">Valor da transferência</label>
    <input
      id="valor"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      class="form-control form-control-lg"
      formControlName="valor"
      placeholder="R$ 0,00"
      [readOnly]="enviando"
      [class.is-invalid]="transferenciaForm.controls.valor.invalid && transferenciaForm.controls.valor.touched"
    />
    <div class="invalid-feedback">Informe um valor com até duas casas decimais.</div>

    @if (mensagemFeedback) {
      @if (isError) {
        <div class="alert alert-danger mt-3" role="alert">{{ mensagemFeedback }}</div>
      } @else {
        <div class="alert alert-success mt-3" role="status">{{ mensagemFeedback }}</div>
      }
    }

    <div class="d-flex flex-wrap gap-2 mt-4">
      <a routerLink="/cliente/dashboard" class="btn btn-outline-secondary">Voltar</a>
      <button type="submit" class="btn btn-primary" [disabled]="transferenciaForm.invalid || enviando">
        {{ enviando ? 'Transferindo...' : 'Transferir' }}
      </button>
    </div>
  </form>
</section>
