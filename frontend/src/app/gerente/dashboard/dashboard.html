<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>BANTADS - Área do Cliente</h1>
        <button class="btn btn-danger" (click)="logout()">Sair</button>
      </div>
      
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Bem-vindo, {{ usuario?.nome }}!</h5>
          <p class="card-text">
            <strong>CPF:</strong> {{ usuario?.cpf }}<br>
            <strong>Email:</strong> {{ usuario?.email }}
          </p>
        </div>
      </div>
      
      <div class="row">
        <div class="col-md-3 mb-3">
          <div class="card text-center h-100">
            <div class="card-body">
              <h5>Depósito</h5>
              <p class="text-muted small">Depositar dinheiro na conta</p>
              <a routerLink="/cliente/deposito" class="btn btn-primary">Acessar</a>
            </div>
          </div>
        </div>
        
        <div class="col-md-3 mb-3">
          <div class="card text-center h-100">
            <div class="card-body">
              <h5>Saque</h5>
              <p class="text-muted small">Sacar dinheiro da conta</p>
              <a routerLink="/cliente/saque" class="btn btn-primary">Acessar</a>
            </div>
          </div>
        </div>
        
        <div class="col-md-3 mb-3">
          <div class="card text-center h-100">
            <div class="card-body">
              <h5>Transferência</h5>
              <p class="text-muted small">Transferir para outra conta</p>
              <a routerLink="/cliente/transferencia" class="btn btn-primary">Acessar</a>
            </div>
          </div>
        </div>
        
        <div class="col-md-3 mb-3">
          <div class="card text-center h-100">
            <div class="card-body">
              <h5>Extrato</h5>
              <p class="text-muted small">Ver movimentações</p>
              <a routerLink="/cliente/extrato" class="btn btn-primary">Acessar</a>
            </div>
          </div>
        </div>
      </div>
      
    </div>
  </div>
</div>
